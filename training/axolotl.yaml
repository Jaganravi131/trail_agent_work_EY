# Axolotl config — same corpus, for when there is more than one GPU.
#   pip install "axolotl[deepspeed]"
#   accelerate launch -m axolotl.cli.train training/axolotl.yaml
base_model: Qwen/Qwen3.6-8B
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer

datasets:
  - path: dataset/sft-train.jsonl
    type: sharegpt
    conversation: chatml
val_set_size: 0.05

load_in_4bit: true
adapter: lora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true

trainer: sft
sft_trainer:
  epochs: 3.0
  batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  optimizer: adamw_bnb_8bit
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 10

output_dir: out/finetune/axolotl
hub_model_id: null
flash_attention: sdpa
