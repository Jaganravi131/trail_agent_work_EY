# Generated by `wf site`. Publishes the folder as-is; there is no build step.
[build]
  command = "# no build: run ./wf site and commit docs/"
  publish = "docs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
